<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>
    <link rel="stylesheet" href="details.css">
</head>
<body>
    <div class="container">
        <div class="section">
            <div class="section-header">
                <h2>Student Details</h2>
                <button class="edit-btn" >Edit</button>
            </div>
            <div class="details-grid">
                <div class="detail-row">
                    <span class="detail-label">Student Number</span>
                    <span class="detail-value">23-00195</span>
                </div>
                <div class="qr-section">
                    <div class="qr-code">
                        <div class="qr-placeholder"></div>
                    </div>
                </div>
                <div class="detail-row">
                    <span class="detail-label">First Name</span>
                    <span class="detail-value">Charles Bernard</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Last Name</span>
                    <span class="detail-value">Balaguer</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Total Attendance</span>
                    <span class="detail-value">10</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Present</span>
                    <span class="detail-value">7</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Absent</span>
                    <span class="detail-value">1</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Late</span>
                    <span class="detail-value">2</span>
                </div>
            </div>
        </div>
        <div class="section">
            <div class="section-header">
                <h2>Attendance Records</h2>
            </div>
            <table class="attendance-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>October 14, 2025</td>
                        <td><span class="status-badge status-present">Present</span></td>
                    </tr>
                    <tr>
                        <td>October 13, 2025</td>
                        <td><span class="status-badge status-present">Present</span></td>
                    </tr>
                    <tr>
                        <td>October 12, 2025</td>
                        <td><span class="status-badge status-absent">Absent</span></td>
                    </tr>
                    <tr>
                        <td>October 12, 2025</td>
                        <td><span class="status-badge status-late">Late</span></td>
                    </tr>
                    <tr>
                        <td>October 12, 2025</td>
                        <td><span class="status-badge status-late">Late</span></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <button class="back-btn" onclick="goBack()">Back to List</button>
    </div>

    <script>
        function goBack() {
            window.location.href = 'history.html';
        }
    </script>
</body>
</html>
